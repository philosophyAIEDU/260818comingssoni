<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d84">
  <title>연결 대기 중 · 퍼메스 독서</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f6fb; --card: #fff; --text: #141a2b; --dim: #5d6679; --brand: #102d84; }
    @media (prefers-color-scheme: dark) { :root { --bg: #030b28; --card: #0a163a; --text: #fff; --dim: #9cb2e6; --brand: #8fa8ff; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    main { width: min(360px, calc(100% - 32px)); padding: 28px 24px; border-radius: 18px; background: var(--card); text-align: center; }
    h1 { font-size: 19px; margin: 14px 0 8px; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: var(--dim); word-break: keep-all; }
    button { font: inherit; font-weight: 700; padding: 12px 20px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; }
  </style>
</head>
<body>
  <main>
    <div aria-hidden="true" style="font-size:34px">📶</div>
    <h1>인터넷 연결을 기다리고 있어요</h1>
    <p>연결되면 바로 독서 멤버십을 열 수 있어요. 와이파이나 데이터를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
