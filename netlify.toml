[build]
  publish = "."
  functions = "netlify/functions"

# 매일 00:10(KST) = 전날 15:10(UTC) 에, 그 시점 기준 누적 누락이 정확히 5회가 된 참여자에게
# 자동으로 안내 메일을 보냅니다. 킥아웃 시즌에는 "한 번 더 놓치면 킥아웃", 정리본 시즌에는
# "한 번 더 놓치면 정리본을 못 받아요" 문구입니다. (23:59 KST 마감 직후라 그날 누락이 확정된 상태)
[functions."send-missed5-warning"]
  schedule = "10 15 * * *"

# 매일 21:00(KST) = 12:00(UTC) 에, 그날 아직 인증하지 않은 참여자에게 리마인드 메일을
# 보냅니다. 마감(24:00 KST)까지 세 시간 남은 시각이라 지금 알려주면 아직 늦지 않습니다.
[functions."send-daily-reminder"]
  schedule = "0 12 * * *"

# 10분마다, 운영진이 예약해 둔 인사이트 정리본 메일이 있는지 본다(한 번에 20초어치만 보내고 남으면 다음 실행에 이어서). 예약 시각이 지났고
# 시즌 인증 기간이 끝났으면 누락 5회 이하(정리본 대상) 멤버 전원에게 한 번 보낸다.
# 기본 예약 시각은 시즌이 끝난 뒤 월요일 09:00(KST) = 월요일 00:00(UTC).
[functions."send-gift-scheduled"]
  schedule = "*/10 * * * *"

# 10분마다, 시즌 시작일 09:00~22:00(KST)이면 앱 명단에 새로 들어온 사람에게 단톡방 초대 문자를 한 번씩 보낸다.
# (명단은 래피드 결제 서버가 시작일 06:00에 roster-import로 넣는다. 링크는 js/config.js 시즌의 kakaoInvite.url)
[functions."send-season-invite"]
  schedule = "*/10 * * * *"

# 홈 화면 설치용 manifest — 기본값(octet-stream) 대신 제 형식으로 보낸다
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# 서비스 워커는 늘 새로 받아야 고친 내용이 바로 퍼진다
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# 독서 멤버십 상세페이지 바로가기 — SNS·vo.la 짧은 링크는 이 주소로 건다.
# (vo.la 무료 회원은 notion.site 주소를 막고, notion.so 주소는 노션 앱 화면·상위 페이지 경로가 보인다)
# 매달 새 상세페이지가 나오면 to 만 새 공개 주소로 바꾼다. 상세페이지는 상위 경로가 안 보이도록 「퍼메스 독서챌린지」 바로 아래에 두고 단독으로 웹 게시한다. ?utm_… 쿼리는 그대로 따라간다.
[[redirects]]
  from = "/membership"
  to = "https://capable-hook-3dd.notion.site/41df15a6c51c81159d56c05ef08fdc68"
  status = 302
  force = true
