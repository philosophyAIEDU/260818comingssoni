<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d84">
  <meta name="color-scheme" content="light dark">
  <title>퍼스널메이커스 독서 챌린지 · 인증 피드 전체 보기</title>
  <meta name="description" content="지금까지 제출된 모든 인증글을 최신순으로 한눈에 볼 수 있는 페이지입니다.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/png" href="icons/favicon-64.png?v=blue-logo-2">
  <!-- 홈 화면에 추가했을 때 아이콘·이름(아이폰은 apple-touch-icon, 안드로이드는 manifest) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=blue-logo-2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="독서 멤버십">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body class="app">

  <header class="top">
    <div class="top-in">
      <div class="brand">
        <img class="brand-logo" src="logo-header.jpg" alt="퍼스널메이커스 로고">
        <div class="brand-text">
          <h1>인증 피드 전체 보기</h1>
          <p>퍼스널메이커스 독서 챌린지</p>
        </div>
      </div>
      <nav class="navlinks">
        <a href="index.html">인증하기</a>
        <a href="admin.html">운영진</a>
      </nav>
    </div>
  </header>

  <main class="wrap wide">

    <section class="card feed-card">
      <div class="feed-head">
        <h2>인증 피드 · 전체 보기 <span class="tag" id="feedCount">0건</span></h2>
        <div class="feed-head-actions">
          <button type="button" id="feedRefresh" class="small ghost" title="피드 새로고침"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.85"/><path d="M13.7 2.7v3h-3"/></svg> 새로고침</button>
        </div>
      </div>
      <p class="hint">
        지금까지 제출된 모든 인증글을 날짜별로 묶어 최신 날짜부터 볼 수 있습니다.
        하루씩 넘겨 보고 싶다면 <a href="index.html">인증하기 페이지의 인증 피드</a>를 이용해 주세요.
      </p>
      <p class="hint">내게 인상 깊은 인사이트는 퍼메스 독서 멤버십 단톡방에서 공유해 보세요.</p>
      <p class="hint">사람을 골라서 그 사람의 인증 기록만 모아 보거나, 텍스트 파일(.txt)로 내려받아 따로 보관할 수 있습니다.</p>

      <div class="row compact-controls" style="margin-bottom:14px">
        <div>
          <label class="muted" for="allFeedSort">정렬</label>
          <select id="allFeedSort">
            <option value="recent">최신순</option>
            <option value="likes">추천 많은순</option>
          </select>
        </div>
        <div>
          <label class="muted" for="allFeedDate">날짜</label>
          <select id="allFeedDate">
            <option value="">전체 날짜</option>
          </select>
        </div>
        <div>
          <label class="muted" for="allFeedPerson">사람별로 보기</label>
          <select id="allFeedPerson">
            <option value="">전체</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end">
          <button type="button" id="allFeedDownloadBtn" class="small ghost" style="width:100%" disabled
            title="사람을 먼저 선택해 주세요"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 2.7v7.5"/><path d="M4.9 7.3 8 10.4l3.1-3.1"/><path d="M2.8 12.4v.7a1.2 1.2 0 0 0 1.2 1.2h8a1.2 1.2 0 0 0 1.2-1.2v-.7"/></svg> TXT로 다운로드</button>
        </div>
      </div>

      <div id="allFeedList" class="all-feed-groups">
        <div class="empty">불러오는 중…</div>
      </div>
      <div class="feed-more-wrap" id="allFeedLoadMoreWrap" hidden>
        <button type="button" id="allFeedLoadMoreBtn" class="small"></button>
      </div>
    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/post.js"></script>
  <script src="js/phrase.js"></script>
  <script src="js/store-firebase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/share-card.js"></script>
  <script src="js/feed-all.js"></script>
</body>

</html>
