[build]
  publish = "."
  functions = "netlify/functions"

# 매일 00:10(KST) = 전날 15:10(UTC) 에, 그 시점 기준 누적 누락이 정확히 5회가 된 참여자에게
# 자동으로 안내 메일을 보냅니다. 킥아웃 시즌에는 "한 번 더 놓치면 킥아웃", 정리본 시즌에는
# "한 번 더 놓치면 정리본을 못 받아요" 문구입니다. (23:59 KST 마감 직후라 그날 누락이 확정된 상태)
[functions."send-missed5-warning"]
  schedule = "10 15 * * *"

# 매일 21:00(KST) = 12:00(UTC) 에, 그날 아직 인증하지 않은 참여자에게 리마인드 메일을
# 보냅니다. 마감(24:00 KST)까지 세 시간 남은 시각이라 지금 알려주면 아직 늦지 않습니다.
[functions."send-daily-reminder"]
  schedule = "0 12 * * *"

# 10분마다, 운영진이 예약해 둔 인사이트 정리본 메일이 있는지 본다(한 번에 20초어치만 보내고 남으면 다음 실행에 이어서). 예약 시각이 지났고
# 시즌 인증 기간이 끝났으면 누락 5회 이하(정리본 대상) 멤버 전원에게 한 번 보낸다.
# 기본 예약 시각은 시즌이 끝난 뒤 월요일 09:00(KST) = 월요일 00:00(UTC).
[functions."send-gift-scheduled"]
  schedule = "*/10 * * * *"
